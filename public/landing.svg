<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Inter, Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#4f46e5" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="220" fill="#c7d2fe" opacity="0.45"/>
  <circle cx="120" cy="620" r="180" fill="#ddd6fe" opacity="0.5"/>

  <!-- navbar -->
  <rect x="40" y="28" width="1120" height="64" rx="32" fill="#ffffff" filter="url(#sh)"/>
  <circle cx="80" cy="60" r="14" fill="url(#btn)"/>
  <text x="104" y="67" font-size="20" font-weight="800" fill="#1e1b4b">Bizora</text>
  <g font-size="15" fill="#475569" font-weight="500">
    <text x="470" y="66">Features</text>
    <text x="560" y="66">Pricing</text>
    <text x="640" y="66">Services</text>
    <text x="730" y="66">Testimonials</text>
  </g>
  <rect x="1000" y="44" width="140" height="32" rx="16" fill="url(#btn)"/>
  <text x="1070" y="65" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Get Started</text>

  <!-- hero text -->
  <rect x="80" y="140" width="200" height="30" rx="15" fill="#e0e7ff"/>
  <text x="180" y="160" font-size="13" font-weight="700" fill="#4338ca" text-anchor="middle">✦ Grow your business faster</text>
  <text x="80" y="232" font-size="54" font-weight="800" fill="#1e1b4b">Modern solutions</text>
  <text x="80" y="294" font-size="54" font-weight="800" fill="#4f46e5">for modern business</text>
  <text x="80" y="336" font-size="18" fill="#64748b">Plan, monitor and scale your company with one</text>
  <text x="80" y="362" font-size="18" fill="#64748b">sleek platform your whole team will love.</text>
  <rect x="80" y="392" width="170" height="52" rx="26" fill="url(#btn)" filter="url(#sh)"/>
  <text x="165" y="425" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Start free trial</text>
  <rect x="266" y="392" width="150" height="52" rx="26" fill="#fff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="341" y="425" font-size="16" font-weight="700" fill="#4338ca" text-anchor="middle">▶ Watch demo</text>

  <!-- dashboard mockup -->
  <g filter="url(#sh)">
    <rect x="640" y="140" width="480" height="320" rx="22" fill="#ffffff"/>
  </g>
  <rect x="640" y="140" width="480" height="40" rx="22" fill="#f1f5f9"/>
  <rect x="640" y="160" width="480" height="20" fill="#f1f5f9"/>
  <circle cx="668" cy="160" r="5" fill="#f87171"/><circle cx="688" cy="160" r="5" fill="#fbbf24"/><circle cx="708" cy="160" r="5" fill="#34d399"/>
  <rect x="664" y="200" width="140" height="80" rx="14" fill="url(#card)"/>
  <text x="680" y="228" font-size="12" fill="#e0e7ff">Revenue</text>
  <text x="680" y="262" font-size="26" font-weight="800" fill="#fff">$48.2k</text>
  <rect x="820" y="200" width="140" height="80" rx="14" fill="#f5f3ff"/>
  <text x="836" y="228" font-size="12" fill="#6b7280">Customers</text>
  <text x="836" y="262" font-size="26" font-weight="800" fill="#4338ca">2,481</text>
  <rect x="976" y="200" width="120" height="80" rx="14" fill="#ecfdf5"/>
  <text x="992" y="228" font-size="12" fill="#6b7280">Growth</text>
  <text x="992" y="262" font-size="26" font-weight="800" fill="#059669">+24%</text>
  <polyline points="664,420 720,390 776,402 832,350 888,368 944,320 1000,336 1096,290" fill="none" stroke="#6366f1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="664,440 720,424 776,430 832,402 888,412 944,386 1000,396 1096,372" fill="none" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- company logos -->
  <text x="600" y="506" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="3">TRUSTED BY TEAMS AT</text>
  <g font-size="22" font-weight="800" fill="#cbd5e1">
    <text x="130" y="544">Vertex</text>
    <text x="330" y="544">Nimbus</text>
    <text x="530" y="544">Lumen</text>
    <text x="710" y="544">Orbit</text>
    <text x="890" y="544">Quanta</text>
    <text x="1040" y="544">Zenith</text>
  </g>

  <!-- feature / pricing cards -->
  <g filter="url(#sh)">
    <rect x="80" y="578" width="330" height="96" rx="18" fill="#fff"/>
    <rect x="435" y="578" width="330" height="96" rx="18" fill="#fff"/>
    <rect x="790" y="578" width="330" height="96" rx="18" fill="#fff"/>
  </g>
  <circle cx="122" cy="626" r="20" fill="#e0e7ff"/><text x="122" y="634" font-size="20" text-anchor="middle">📅</text>
  <text x="156" y="620" font-size="17" font-weight="800" fill="#1e1b4b">Smart scheduling</text>
  <text x="156" y="644" font-size="13" fill="#64748b">Plan work in a few clicks</text>
  <circle cx="477" cy="626" r="20" fill="#ede9fe"/><text x="477" y="634" font-size="20" text-anchor="middle">📈</text>
  <text x="511" y="620" font-size="17" font-weight="800" fill="#1e1b4b">Live monitoring</text>
  <text x="511" y="644" font-size="13" fill="#64748b">Track every metric in real time</text>
  <circle cx="832" cy="626" r="20" fill="#dcfce7"/><text x="832" y="634" font-size="20" text-anchor="middle">💳</text>
  <text x="866" y="620" font-size="17" font-weight="800" fill="#1e1b4b">Simple pricing</text>
  <text x="866" y="644" font-size="13" fill="#64748b">Plans that grow with you</text>
</svg>
